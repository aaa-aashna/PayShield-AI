[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payshield-ai"
version = "0.1.0"
description = "Adaptive ML-Driven Payment Security and Fraud Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "networkx>=3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyarrow>=15.0.0",
    "joblib>=1.3.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["blue_team*", "red_team*", "simulator*", "api*", "web*", "experiments*"]
